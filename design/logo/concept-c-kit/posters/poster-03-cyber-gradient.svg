<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600" role="img" aria-labelledby="p3-title">
  <title id="p3-title">Raphael Dacara - Cyber Mobile Developer Poster</title>
  <defs>
    <radialGradient id="mesh-1" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#1E1B4B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh-2" cx="80%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh-3" cx="20%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="1600" fill="#050811"/>
  
  <!-- Atmospheric Glow Meshes -->
  <rect width="1200" height="1600" fill="url(#mesh-1)"/>
  <rect width="1200" height="1600" fill="url(#mesh-2)"/>
  <rect width="1200" height="1600" fill="url(#mesh-3)"/>

  <!-- Code Texture Backdrop -->
  <g font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#334155" opacity="0.45">
    <text x="80" y="160">class RaphaelDacara extends MobileEngineer {</text>
    <text x="120" y="190">@override</text>
    <text x="120" y="220">Widget build(BuildContext context) =&gt; ResponsiveView(</text>
    <text x="160" y="250">targetFrameRate: 120.fps,</text>
    <text x="160" y="280">architecture: CleanArchitecture(),</text>
    <text x="160" y="310">crossPlatform: [iOS, Android, Web],</text>
    <text x="120" y="340">);</text>
    <text x="80" y="370">}</text>
  </g>

  <!-- Floating Glass Card for Hero Symbol -->
  <rect x="250" y="440" width="700" height="700" rx="96" fill="#0F172A" fill-opacity="0.5" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Central Glowing Hero Symbol -->
  <g transform="translate(345, 535) scale(2.0)" filter="url(#glow-blur)">
    <g fill="none" stroke="url(#neon-stroke)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 56 216 V 40"/>
      <path d="M 56 40 H 104 C 124 40 136 52 136 78 C 136 104 124 116 104 116 H 56"/>
      <path d="M 96 116 L 138 216"/>
      <path d="M 128 40 H 152 C 184 40 200 58 200 94 V 162 C 200 198 184 216 152 216 H 138"/>
      <circle cx="166" cy="74" r="6" fill="#67E8F9" stroke="none"/>
    </g>
  </g>

  <!-- Title & Tagline -->
  <text x="600" y="1250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.02em" fill="#FFFFFF">RAPHAEL DACARA</text>
  <text x="600" y="1300" text-anchor="middle" font-family="'SF Mono', monospace" font-size="18" font-weight="600" letter-spacing="0.3em" fill="#38BDF8">FLUTTER &amp; FULL-STACK DEVELOPER</text>
  <text x="600" y="1340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#94A3B8">Engineered for 120fps fluid mobile experiences &amp; clean architectures</text>

  <!-- Top Badge -->
  <rect x="80" y="80" width="180" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="170" y="103" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" font-weight="600" fill="#38BDF8">FLUTTER SPECIALIST</text>

  <!-- Footer Info -->
  <text x="80" y="1520" font-family="'SF Mono', monospace" font-size="12" fill="#64748B">PORTFOLIO POSTER SERIES 03 // MOBILE ARCHITECTURE</text>
  <text x="1120" y="1520" text-anchor="end" font-family="'SF Mono', monospace" font-size="12" fill="#64748B">RAPHAELDACARA.COM</text>
</svg>